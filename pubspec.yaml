
name: movira
description: "A production-grade smart bus route, live tracking and customer support application."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  google_sign_in: ^7.2.0
  csv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/images/
    - assets/gtfs/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/movira_icon.png"
  adaptive_icon_background: "#071B2C"
  adaptive_icon_foreground: "assets/branding/movira_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#071B2C"
  image: "assets/branding/movira_icon.png"

  android: true
  ios: false
  web: false

  android_12:
    color: "#071B2C"
    image: "assets/branding/movira_icon.png"
